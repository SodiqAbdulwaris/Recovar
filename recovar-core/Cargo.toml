[package]
name = "recovar-core"
version = "0.1.0"
edition = "2021"
description = "Core file recovery engine for Recovar"

[dependencies]
anyhow = "1"
thiserror = "1"
byteorder = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
