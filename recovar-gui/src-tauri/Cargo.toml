[package]
name = "recovar-gui"
version = "0.1.0"
edition = "2021"
description = "Recovar GUI — Tauri 2.0 desktop application"

[lib]
name = "recovar_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "recovar-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
recovarcorelib = { path = "../../recovar-core", package = "recovar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
